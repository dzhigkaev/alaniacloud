name: Deploy to S3 + Invalidate CloudFront

on:
  push:
    branches:
      - main  # or master, depending on your default branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1  # Change if you're in another region

    - name: Upload to S3
      run: |
        aws s3 cp index.html s3://alaniacloud.com/index.html
        aws s3 sync ./assets s3://alaniacloud.com/assets
        aws s3 sync ./resume s3://alaniacloud.com/resume

    - name: Invalidate CloudFront Cache
      uses: chetan/invalidate-cloudfront-action@v2
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: us-east-1
        DISTRIBUTION: ${{ secrets.YOUR_CLOUDFRONT_DIST_ID }}
        PATHS: "/*"