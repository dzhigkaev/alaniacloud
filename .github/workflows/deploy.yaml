name: Deploy to S3 + Invalidate CloudFront

on:
  push:
    branches:
      - main

# Gap #6: least-privilege token. id-token:write is required for OIDC (Gap #1).
permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # Gap #5: pinned to commit SHA (immutable), not a mutable tag.
    - name: Checkout Code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    # Gap #1: OIDC. No long-lived keys — GitHub mints a short-lived token,
    # AWS hands back temporary credentials for the role below.
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: us-east-1

    - name: Upload to S3
      run: |
        aws s3 cp index.html s3://alaniacloud/index.html
        aws s3 sync ./assets s3://alaniacloud/assets
        aws s3 sync ./resume s3://alaniacloud/resume

    # Gap #5: dropped the third-party chetan/invalidate-cloudfront-action
    # in favour of one AWS CLI call (already present in the runner).
    - name: Invalidate CloudFront Cache
      run: |
        aws cloudfront create-invalidation \
          --distribution-id ${{ secrets.YOUR_CLOUDFRONT_DIST_ID }} \
          --paths "/*"
